<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My English App</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        .card { background: #fff; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; padding: 30px 20px; text-align: center; margin-top: 15px; box-sizing: border-box; }
        
        .flashcard { cursor: pointer; padding: 20px 10px; border: 2px dashed #bdc3c7; border-radius: 10px; margin-bottom: 20px; background-color: #fdfbfb; transition: background-color 0.2s; min-height: 100px;}
        .flashcard:active { background-color: #f1f2f6; }
        .phrase-en { font-size: 24px; font-weight: bold; color: #2c3e50; }
        .phrase-ja { font-size: 16px; color: #e74c3c; margin-top: 15px; display: none; font-weight: bold; }
        .tap-hint { font-size: 12px; color: #95a5a6; margin-top: 15px; }

        .btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-play { background-color: #3498db; color: white; }
        .btn-record { background-color: #e74c3c; color: white; }
        .btn-next { background-color: #2ecc71; color: white; margin-top: 20px;}
        .btn-stock { background-color: #9b59b6; color: white; }
        .btn-help { background-color: #f39c12; color: white; }
        
        /* AI生成ボタン */
        .btn-generate { background-color: #2c3e50; color: white; border: 2px solid #2c3e50; }
        
        #result-text { margin-top: 10px; min-height: 30px; font-size: 16px; color: #d35400; font-weight: bold; }
        
        /* 設定エリア */
        .settings { margin-top: 20px; font-size: 12px; color: #7f8c8d; text-align: center; width: 100%; max-width: 400px;}
        .settings input { width: 80%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;}
    </style>
</head>
<body>

    <div class="card">
        <!-- ▼ 新しいフレーズを生成するボタン ▼ -->
        <button class="btn btn-generate" id="generateBtn">✨ AIで新しいフレーズを生成</button>

        <div class="flashcard" id="flashcard">
            <div class="phrase-en" id="phraseEn">It's a piece of cake.</div>
            <div class="tap-hint" id="tapHint">👆 タップして日本語訳を表示</div>
            <div class="phrase-ja" id="phraseJa">そんなの朝飯前だよ。</div>
        </div>
        
        <button class="btn btn-play" id="playBtn">🔊 お手本を聴く</button>
        <button class="btn btn-record" id="recordBtn">🎙️ 自分の発音をテスト</button>
        <div id="result-text"></div>
        <button class="btn btn-stock" id="stockBtn">⭐ わからなかったらストック</button>
        <button class="btn btn-next" id="nextBtn">次のフレーズ ➔</button>
    </div>

    <div class="card" style="padding: 15px 20px;">
        <button class="btn btn-help" id="helpBtn">❓ 日本語で質問する</button>
    </div>

    <!-- APIキー入力欄（安全のためにスマホ内にのみ保存） -->
    <div class="settings">
        ⚙️ 設定 (Gemini API Key)<br>
        <input type="password" id="apiKeyInput" placeholder="AI StudioのAPIキーを入力">
        <button onclick="saveApiKey()" style="padding: 5px 10px; margin-top: 5px;">保存</button>
    </div>

    <script>
        // 初期の単語リスト（APIが呼ばれるまではこれを使う）
        let phrases = [
            { en: "It's a piece of cake.", ja: "そんなの朝飯前だよ。" },
            { en: "I'm on my way.", ja: "今向かっているところです。" },
            { en: "Could you speak a little slower?", ja: "もう少しゆっくり話していただけますか？" }
        ];
        let currentIndex = 0;

        // APIキーの保存と読み込み
        const apiKeyInput = document.getElementById('apiKeyInput');
        apiKeyInput.value = localStorage.getItem('geminiApiKey') || '';
        function saveApiKey() {
            localStorage.setItem('geminiApiKey', apiKeyInput.value);
            alert("APIキーをスマホに保存しました！");
        }

        function updateDisplay() {
            document.getElementById('phraseEn').textContent = phrases[currentIndex].en;
            document.getElementById('phraseJa').textContent = phrases[currentIndex].ja;
            document.getElementById('result-text').textContent = '';
            document.getElementById('phraseJa').style.display = 'none';
            document.getElementById('tapHint').style.display = 'block';
        }

        // ▼ Gemini APIを呼び出して新しいフレーズを作る処理 ▼
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) {
                alert("画面下の設定欄にGeminiのAPIキーを入力して「保存」を押してください。");
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.textContent = "⏳ AIがフレーズを考え中...";
            btn.disabled = true;

            // Geminiへの命令文（JSON形式で返して、と指示する）
            const prompt = `日常会話や旅行で使える、自然で少し短めの英語フレーズをランダムに4つ作成してください。
            返答は必ず以下のJSONフォーマットのみにしてください。バッククォート(```)などの装飾は不要です。
            [
              {"en": "英語のフレーズ", "ja": "日本語訳"}
            ]`;

            try {
                const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                // AIの返答からテキストを取り出す
                let text = data.candidates[0].content.parts[0].text;
                // AIが ```json などの余計な文字をつけてきた場合に取り除く処理
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();

                // JSONデータを配列に変換して上書きする
                phrases = JSON.parse(text);
                currentIndex = 0;
                updateDisplay();
                
                alert("新しいフレーズを4つ生成しました！");

            } catch (error) {
                console.error(error);
                alert("エラーが発生しました: " + error.message);
            } finally {
                btn.textContent = "✨ AIで新しいフレーズを生成";
                btn.disabled = false;
            }
        });

        // フラッシュカードのタップ
        document.getElementById('flashcard').addEventListener('click', () => {
            const jaElement = document.getElementById('phraseJa');
            const hintElement = document.getElementById('tapHint');
            if (jaElement.style.display === 'none' || jaElement.style.display === '') {
                jaElement.style.display = 'block'; hintElement.style.display = 'none';
            } else {
                jaElement.style.display = 'none'; hintElement.style.display = 'block';
            }
        });

        // ストック機能
        document.getElementById('stockBtn').addEventListener('click', () => {
            const currentPhrase = phrases[currentIndex];
            let stockedPhrases = JSON.parse(localStorage.getItem('myEnglishStocks')) || [];
            if (!stockedPhrases.some(p => p.en === currentPhrase.en)) {
                stockedPhrases.push(currentPhrase);
                localStorage.setItem('myEnglishStocks', JSON.stringify(stockedPhrases));
                alert("⭐ ストックに保存しました！");
            } else {
                alert("このフレーズはすでにストックされています！");
            }
        });

        // お手本を聴く
        document.getElementById('playBtn').addEventListener('click', () => {
            const utterance = new SpeechSynthesisUtterance(phrases[currentIndex].en);
            utterance.lang = 'en-US'; utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        });

        // 次のフレーズ
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex++;
            if (currentIndex >= phrases.length) currentIndex = 0;
            updateDisplay();
        });

        // 音声認識
        const recordBtn = document.getElementById('recordBtn');
        const resultText = document.getElementById('result-text');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; recognition.interimResults = false;
            recordBtn.addEventListener('click', () => {
                recordBtn.textContent = '🔴 録音中...'; resultText.textContent = 'Listening...';
                recognition.start();
            });
            recognition.onresult = (e) => {
                resultText.textContent = `あなた: ${e.results[0][0].transcript}`;
                recordBtn.textContent = '🎙️ 自分の発音をテスト';
            };
            recognition.onend = () => { recordBtn.textContent = '🎙️ 自分の発音をテスト'; };
        } else {
            recordBtn.style.display = 'none';
        }
        
        updateDisplay();
    </script>
</body>
</html>
