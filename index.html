<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- PWA用のViewport設定（スマホでのズーム無効化など） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My English App</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            text-align: center;
            margin-top: 20px;
        }
        .phrase-en {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .phrase-ja {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-play {
            background-color: #3498db;
            color: white;
        }
        .btn-next {
            background-color: #2ecc71;
            color: white;
        }
        .btn-help {
            background-color: #f39c12;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="phrase-en">It's a piece of cake.</div>
        <div class="phrase-ja">そんなの朝飯前だよ。</div>
        
        <!-- 音声再生用ボタン -->
        <button class="btn btn-play" id="playBtn">🔊 発音を聴く</button>
        <!-- 次の単語へ -->
        <button class="btn btn-next" id="nextBtn">次のフレーズ ➔</button>
    </div>

    <!-- 困った時用の日本語質問トリガー -->
    <div class="card" style="padding: 15px 20px;">
        <button class="btn btn-help" id="helpBtn">❓ 日本語で質問する</button>
    </div>
<script>
        // 単語データのリスト（ここを増やせば単語帳が大きくなります）
        const phrases = [
            { en: "It's a piece of cake.", ja: "そんなの朝飯前だよ。" },
            { en: "I'm on my way.", ja: "今向かっているところです。" },
            { en: "Could you speak a little slower?", ja: "もう少しゆっくり話していただけますか？" },
            { en: "That makes sense.", ja: "なるほど、そういうことですね。" }
        ];

        let currentIndex = 0;

        // 画面の文字を書き換える関数
        function updateDisplay() {
            document.querySelector('.phrase-en').textContent = phrases[currentIndex].en;
            document.querySelector('.phrase-ja').textContent = phrases[currentIndex].ja;
        }

        // ①「発音を聴く」ボタンの動き（ブラウザの音声合成機能）
        document.getElementById('playBtn').addEventListener('click', () => {
            const text = phrases[currentIndex].en;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; // 英語のネイティブ発音に設定
            utterance.rate = 0.9;     // 少しだけゆっくり（1.0が標準）
            speechSynthesis.speak(utterance);
        });

        // ②「次のフレーズ」ボタンの動き
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex++;
            // 最後までいったら最初に戻る
            if (currentIndex >= phrases.length) {
                currentIndex = 0;
            }
            updateDisplay();
        });

        // ③「日本語で質問する」ボタンの動き（仮）
        document.getElementById('helpBtn').addEventListener('click', () => {
            alert("ここにAI（Gemini等）への日本語質問チャット画面を開く処理を追加します！");
        });
    </script>
    
</body>
</html>
