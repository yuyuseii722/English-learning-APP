<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My English App</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; height: 100vh; }
        
        /* 画面全体の枠組み（アプリっぽくする） */
        .app-container { width: 100%; max-width: 400px; position: relative; }
        
        /* 各画面のスタイル（最初はホーム画面以外隠す） */
        .screen { display: none; width: 100%; animation: fadeIn 0.3s; }
        .screen.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ヘッダー周り */
        .header { display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #ecf0f1; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #2c3e50; padding: 0 15px 0 0; }
        .screen-title { font-size: 20px; font-weight: bold; color: #2c3e50; margin: 0; }

        /* ホーム画面用カード */
        .menu-card { background: #fff; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 15px; text-align: center; cursor: pointer; transition: transform 0.1s; }
        .menu-card:active { transform: scale(0.98); }
        .menu-icon { font-size: 40px; margin-bottom: 10px; }
        .menu-title { font-size: 18px; font-weight: bold; color: #2c3e50; }

        /* 単語帳・設定画面用カード */
        .card { background: #fff; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 30px 20px; text-align: center; margin-bottom: 20px;}
        
        /* 単語帳のフラッシュカード */
        .flashcard { cursor: pointer; padding: 20px 10px; border: 2px dashed #bdc3c7; border-radius: 10px; margin-bottom: 20px; background-color: #fdfbfb; min-height: 100px;}
        .phrase-en { font-size: 24px; font-weight: bold; color: #2c3e50; }
        .phrase-ja { font-size: 16px; color: #e74c3c; margin-top: 15px; display: none; font-weight: bold; }
        .tap-hint { font-size: 12px; color: #95a5a6; margin-top: 15px; }

        /* ボタン類 */
        .btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-play { background-color: #3498db; color: white; }
        .btn-next { background-color: #2ecc71; color: white; margin-top: 20px;}
        
        /* 設定画面 */
        .settings-input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px;}
        .btn-save { background-color: #34495e; color: white; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- =========================
         1. ホーム画面 
    ========================== -->
    <div id="homeScreen" class="screen active">
        <h1 style="color: #2c3e50; text-align: center; margin-bottom: 30px;">🏠 Home</h1>
        
        <div class="menu-card" onclick="showScreen('vocabScreen')">
            <div class="menu-icon">📖</div>
            <div class="menu-title">単語帳モード</div>
        </div>

        <div class="menu-card" onclick="alert('準備中！ここにAIチャット機能が入ります')">
            <div class="menu-icon">🗣️</div>
            <div class="menu-title">英会話モード</div>
        </div>

        <div class="menu-card" onclick="showScreen('settingsScreen')">
            <div class="menu-icon">⚙️</div>
            <div class="menu-title">設定</div>
        </div>
    </div>

    <!-- =========================
         2. 単語帳画面 
    ========================== -->
    <div id="vocabScreen" class="screen">
        <div class="header">
            <button class="back-btn" onclick="showScreen('homeScreen')">←</button>
            <h2 class="screen-title">単語帳モード</h2>
        </div>

        <div class="card">
            <div class="flashcard" id="flashcard">
                <div class="phrase-en" id="phraseEn">It's a piece of cake.</div>
                <div class="tap-hint" id="tapHint">👆 タップして日本語訳を表示</div>
                <div class="phrase-ja" id="phraseJa">そんなの朝飯前だよ。</div>
            </div>
            
            <button class="btn btn-play" id="playBtn">🔊 お手本を聴く</button>
            <button class="btn btn-next" id="nextBtn">次のフレーズ ➔</button>
        </div>
    </div>

    <!-- =========================
         3. 設定画面 
    ========================== -->
    <div id="settingsScreen" class="screen">
        <div class="header">
            <button class="back-btn" onclick="showScreen('homeScreen')">←</button>
            <h2 class="screen-title">設定</h2>
        </div>

        <div class="card">
            <p style="text-align: left; color: #7f8c8d; font-size: 14px;">Gemini API Key</p>
            <input type="password" id="apiKeyInput" class="settings-input" placeholder="APIキーを入力">
            <button class="btn btn-save" onclick="saveApiKey()">キーを保存する</button>
        </div>
    </div>

</div>

<!-- ▼ JavaScript (画面の切り替えと単語帳の基本動作) ▼ -->
<script>
    // --- 画面切り替えの仕組み ---
    function showScreen(screenId) {
        // すべての画面から 'active' クラスを外して隠す
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        // 指定された画面だけ 'active' をつけて表示する
        document.getElementById(screenId).classList.add('active');
    }

    // --- 設定画面の処理 ---
    const apiKeyInput = document.getElementById('apiKeyInput');
    // 起動時にスマホに保存されているキーを表示
    apiKeyInput.value = localStorage.getItem('geminiApiKey') || '';
    
    function saveApiKey() {
        localStorage.setItem('geminiApiKey', apiKeyInput.value);
        alert("APIキーを保存しました！");
    }

    // --- 単語帳画面の処理 ---
    const phrases = [
        { en: "It's a piece of cake.", ja: "そんなの朝飯前だよ。" },
        { en: "I'm on my way.", ja: "今向かっているところです。" },
        { en: "Could you speak a little slower?", ja: "もう少しゆっくり話していただけますか？" }
    ];
    let currentIndex = 0;

    function updateDisplay() {
        document.getElementById('phraseEn').textContent = phrases[currentIndex].en;
        document.getElementById('phraseJa').textContent = phrases[currentIndex].ja;
        document.getElementById('phraseJa').style.display = 'none';
        document.getElementById('tapHint').style.display = 'block';
    }

    // フラッシュカードのタップ（日本語表示）
    document.getElementById('flashcard').addEventListener('click', () => {
        const jaElement = document.getElementById('phraseJa');
        const hintElement = document.getElementById('tapHint');
        if (jaElement.style.display === 'none' || jaElement.style.display === '') {
            jaElement.style.display = 'block'; hintElement.style.display = 'none';
        } else {
            jaElement.style.display = 'none'; hintElement.style.display = 'block';
        }
    });

    // お手本を聴く
    document.getElementById('playBtn').addEventListener('click', () => {
        const utterance = new SpeechSynthesisUtterance(phrases[currentIndex].en);
        utterance.lang = 'en-US'; utterance.rate = 0.9;
        speechSynthesis.speak(utterance);
    });

    // 次のフレーズ
    document.getElementById('nextBtn').addEventListener('click', () => {
        currentIndex++;
        if (currentIndex >= phrases.length) currentIndex = 0;
        updateDisplay();
    });

    // アプリ起動時のセットアップ
    updateDisplay();
</script>

</body>
</html>
